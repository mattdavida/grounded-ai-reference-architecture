[project]
name = "eaim-backend"
version = "0.1.0"
description = "Enterprise AI Modernization Reference Architecture backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "sqlalchemy>=2.0",
    "alembic>=1.16",
    "pydantic-settings>=2.10",
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "langgraph>=0.3",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
